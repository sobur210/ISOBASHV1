# Keep-alive pinger for the Render FREE-tier services
# (isobash-web + isobash-api).
#
# Why this exists
#   A Render Free web service spins down after 15 minutes without inbound
#   traffic and takes about a minute to wake. The first request during that
#   wake-up can be answered with HTTP 503, which is what visitors were seeing
#   on https://isobash-web.onrender.com and https://isobash-api.onrender.com.
#   A request every 10 minutes keeps the 15-minute idle timer from ever firing.
#
# READ BEFORE CHANGING THE SCHEDULE (the free-hour budget)
#   Render grants a workspace 750 Free instance-hours per calendar month,
#   SHARED by every free web service, and it SUSPENDS all of them for the rest
#   of the month once the budget is gone (render.com/docs/free). Keeping BOTH
#   services awake 24/7 costs ~1,460 h/month and would suspend them mid-month,
#   which is worse than the cold starts we are trying to remove.
#     budget: 2 services * ~11.25 h/day * 30 days ~= 675 h  (>= 75 h margin)
#   So the pings run inside an 11-hour UTC window and the services spin down
#   as usual outside it. To cover a different local window, edit the cron
#   below (all cron times are UTC) and keep the window <= 11 h/day. For true
#   24/7, upgrade both web services to a paid instance instead.
#
#   GitHub also disables scheduled workflows after 60 days without repo
#   activity; re-enable it from the Actions tab if that happens. An external
#   monitor (e.g. UptimeRobot) is the alternative, but it has the same
#   free-hour budget to respect.
name: keep-alive

on:
  schedule:
    # Every 10 min, 06:00-16:59 UTC (11 h window) ~= 675 instance-hours/month.
    - cron: "*/10 6-16 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping both services
        env:
          # /health is the API's liveness route (always 200); / is the web
          # liveness route (next.config.ts healthCheckPath).
          TARGETS: >-
            https://isobash-api.onrender.com/health
            https://isobash-web.onrender.com/
        run: |
          set -euo pipefail
          for url in $TARGETS; do
            # --retry also retries transient 5xx, so a 503 during a cold start
            # is retried instead of being reported as a failure.
            code=$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' \
              --max-time 60 \
              --retry 2 --retry-delay 10 --retry-all-errors \
              "$url")
            echo "$url -> HTTP $code"
            case "$code" in
              2*) ;;
              *)
                echo "::error::$url returned HTTP $code"
                exit 1
                ;;
            esac
          done
