version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: isobash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: isobash
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: isobash-redis
    restart: unless-stopped
    ports:
      - "6380:6379"

volumes:
  postgres_data:
