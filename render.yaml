# ISOBASH — Render blueprint (FREE tier).
#
# This describes the existing application; it does not simplify or replace it.
#   isobash-web  : Next.js 16 frontend (apps/frontend)
#   isobash-api  : NestJS API (apps/backend) + its in-process BullMQ video worker
#   isobash-db   : Render PostgreSQL (Prisma)
#   isobash-redis: Render Key Value, Redis-compatible (BullMQ queues + rate limits)
#
# apps/worker is deliberately NOT deployed: it is a stub that only logs jobs on
# the `isobash-queue` queue, while the real video-render worker runs inside the
# API process (apps/backend/src/media/video-render.queue.ts). Deploying the stub
# would add a service that consumes and acks jobs without doing the work.
#
# FREE TIER LIMITS this file is designed around (render.com/docs/free):
#   * 750 free instance-hours per workspace per month, shared by BOTH web
#     services — a service running the whole month alone already uses ~720.
#   * Services spin down after 15 minutes without traffic (~1 minute to wake).
#   * The filesystem is ephemeral: uploads, generated media and knowledge
#     indexes are lost on every redeploy, restart and spin-down. There is no
#     disk on the free plan, so DATA_ROOT only ever holds scratch data.
#   * Free Postgres expires 30 DAYS after creation (14-day grace to upgrade,
#     then the data is deleted). Export or upgrade before that.
#   * Free Key Value is in-memory only: a restart empties the render queue.
#   * Free services can SEND private-network requests to these datastores but
#     cannot RECEIVE them, which is why the API reaches Postgres/Redis over
#     their internal URLs and the web app reaches the API over its public URL.
#
# The public URLs are derived from the service names below. If Render reports a
# name collision, rename the service AND the matching `value:` URL together.

databases:
  - name: isobash-db
    plan: free
    databaseName: isobash
    user: isobash

services:
  - type: keyvalue
    name: isobash-redis
    plan: free
    # Internal only: the API connects with the instance's internal URL.
    ipAllowList: []
    # BullMQ holds queued video renders in memory until they run: an LRU policy
    # would evict a waiting job and silently drop the user's render. (Free
    # instances are in-memory anyway — a restart loses every queued job.)
    maxmemoryPolicy: noeviction
    persistenceMode: off

  - type: web
    name: isobash-api
    runtime: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build:backend && npx prisma migrate deploy
    startCommand: node apps/backend/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Render injects PORT itself; the API reads it (apps/backend/src/main.ts).
      - key: DATABASE_URL
        fromDatabase:
          name: isobash-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: isobash-redis
          type: keyvalue
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      # Web and API are different origins on *.onrender.com, so the session
      # cookie has to be cross-site: SameSite=None without Secure is dropped by
      # browsers, which is why the two are set together here.
      - key: WEB_URL
        value: https://isobash-web.onrender.com
      - key: CORS_ORIGIN
        value: https://isobash-web.onrender.com
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_SECURE
        value: "true"
      # Ephemeral: media written here is gone after a redeploy or spin-down.
      - key: DATA_ROOT
        value: /var/isobash-data
      - key: MODEL_ROOT
        value: /var/isobash-data/models
      # Feature flags must match the frontend's NEXT_PUBLIC_FEATURE_* values.
      - key: FEATURE_PROJECTS
        value: "false"
      - key: FEATURE_FILES
        value: "false"
      - key: FEATURE_CODE_WORKSPACE
        value: "true"
      # Local models do not exist on Render; say so rather than probe a
      # loopback address that will never answer.
      - key: OLLAMA_ENABLED
        value: "false"
      # The API REFUSES TO BOOT if a provider is enabled without its key, so
      # providers ship disabled. Paste the key in the dashboard (below), then
      # flip its *_ENABLED flag to "true" and redeploy.
      - key: GEMINI_ENABLED
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_ENABLED
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      # Video/image providers: enable by flipping *_ENABLED to "true" once the
      # matching sync: false key has been filled in the dashboard.
      - key: MAGICHOUR_ENABLED
        value: "false"
      - key: MAGICHOUR_API_KEY
        sync: false
      - key: DEEPAI_ENABLED
        value: "false"
      - key: DEEPAI_API_KEY
        sync: false
      - key: JSON2VIDEO_ENABLED
        value: "false"
      - key: JSON2VIDEO_API_KEY
        sync: false

  - type: web
    name: isobash-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:frontend
    startCommand: npm --workspace apps/frontend run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Read at build time (apps/frontend/lib/config.ts) for browser fetches,
      # CSP `connect-src`, and the server-side rewrite in next.config.ts.
      - key: NEXT_PUBLIC_API_URL
        value: https://isobash-api.onrender.com
      - key: NEXT_PUBLIC_WEB_URL
        value: https://isobash-web.onrender.com
      - key: INTERNAL_API_URL
        value: https://isobash-api.onrender.com
      - key: NEXT_PUBLIC_FEATURE_PROJECTS
        value: "false"
      - key: NEXT_PUBLIC_FEATURE_FILES
        value: "false"
      - key: NEXT_PUBLIC_FEATURE_CODE_WORKSPACE
        value: "true"
